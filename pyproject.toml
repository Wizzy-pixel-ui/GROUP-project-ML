[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgd-natural-flow-api"
version = "0.1.0"
description = "Research FastAPI service for well production-history analysis"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6,<3",
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "openpyxl>=3.1",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
sgd-api = "sgd_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sgd_api*", "sgd_ml*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
